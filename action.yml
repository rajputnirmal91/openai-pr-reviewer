name: 'Ollama PR Reviewer'
description: 'Review PRs with Ollama and comment inline'
author: 'Nirmal Rajput'
inputs:
  github-token:
    description: 'GitHub token for API access'
    required: true
  ai-api-key:
    description: 'Ollama API key'
    required: false
    default: 'abcdefgh'
  ollama-url:
    description: 'Ollama server URL'
    required: false
    default: 'https://ollama.jaihindji.in/'
  model:
    description: 'Ollama model to use'
    required: false
    default: 'gpt-oss:20b-cloud'
  max-files:
    description: 'Maximum files to review'
    required: false
    default: '10'
runs:
  using: 'composite'
  steps:
    - run: npm install
      shell: bash
      working-directory: ${{ github.action_path }}
    - run: node src/index.js
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_AI_API_KEY: ${{ inputs.ai-api-key }}
        INPUT_OLLAMA_URL: ${{ inputs.ollama-url }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_MAX_FILES: ${{ inputs.max-files }}
branding:
  icon: 'check-circle'
  color: 'green'
